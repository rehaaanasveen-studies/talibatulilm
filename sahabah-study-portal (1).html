<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahabah Study Portal</title>
<style>
:root{
  --maroon:#5A0B1D; --maroon-deep:#3f0714;
  --maroon-soft:#7a2336;
  --ivory:#FAF4E6; --parchment:#F3EAD3; --beige:#EFE5CC; --card:#FFFCF4;
  --gold:#A8843A; --gold-soft:#D9C48F; --gold-bg:#F1E6C4;
  --ink:#2A1A1D; --ink-soft:#5C4A4D; --line:#E2D6B8;
  --shadow:0 1px 2px rgba(63,7,20,.06),0 6px 18px rgba(63,7,20,.05);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Header */
header{background:var(--maroon);color:#F7EDD3;padding:34px 20px 28px;text-align:center;border-bottom:4px solid var(--gold)}
header .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:8px}
header h1{font-family:var(--serif);font-weight:normal;font-size:clamp(28px,5vw,42px);line-height:1.2;margin:0 0 8px}
header p{margin:0 auto;max-width:620px;color:#E8D9B5;font-size:16px}
.totals{margin-top:14px;font-size:14px;color:var(--gold-soft)}

/* Sticky control bar */
.bar{position:sticky;top:0;z-index:20;background:var(--ivory);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(63,7,20,.05)}
.bar-inner{max-width:980px;margin:0 auto;padding:14px 20px 0}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:14px;width:20px;height:20px;stroke:var(--ink-soft);fill:none;stroke-width:2}
.search input{width:100%;padding:13px 100px 13px 44px;font:inherit;font-size:17px;border:1.5px solid var(--gold-soft);border-radius:12px;background:var(--card);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(90,11,29,.12)}
.search button{position:absolute;right:8px;border:0;background:var(--beige);color:var(--maroon);padding:6px 14px;border-radius:8px;font-size:14px;font-weight:600;display:none}
.search button.show{display:block}
.tabs{display:flex;gap:6px;margin-top:14px}
.tab{flex:1;border:0;background:transparent;padding:12px 10px;font-family:var(--serif);font-size:18px;color:var(--ink-soft);border-bottom:3px solid transparent;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.tab .n{font-family:var(--sans);font-size:13px;background:var(--beige);color:var(--ink-soft);padding:1px 9px;border-radius:99px}
.tab[aria-selected=true]{color:var(--maroon);border-bottom-color:var(--maroon);font-weight:bold}
.tab[aria-selected=true] .n{background:var(--maroon);color:#fff}
.tabs.dim{opacity:.45;pointer-events:none}

main{max-width:980px;margin:0 auto;padding:24px 20px 90px}

/* Section nav */
.sections{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:26px}
.sec{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.sec:hover{border-color:var(--gold)}
.sec .pt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.sec .tt{font-family:var(--serif);font-size:14.5px;line-height:1.35;color:var(--ink);flex:1}
.sec .ct{font-size:13px;color:var(--ink-soft)}
.sec[aria-selected=true]{background:var(--maroon);border-color:var(--maroon)}
.sec[aria-selected=true] .pt{color:var(--gold-soft)}
.sec[aria-selected=true] .tt{color:#fff}
.sec[aria-selected=true] .ct{color:#EBDDBB}

/* Section heading */
.sec-head{margin-bottom:6px}
.sec-head .kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.sec-head h2{font-family:var(--serif);font-weight:normal;color:var(--maroon);font-size:clamp(23px,3.6vw,30px);line-height:1.3;margin:4px 0 4px}
.sec-head .sub{color:var(--ink-soft);font-size:15.5px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.tools .count{font-size:15px;color:var(--ink-soft)}
.tools button{border:1px solid var(--gold-soft);background:var(--card);color:var(--maroon);padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600}
.tools button:hover{background:var(--gold-bg)}

/* Cards */
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:190px}
.card.open{border-color:var(--gold)}
.head{width:100%;display:flex;align-items:flex-start;gap:14px;border:0;background:transparent;text-align:left;padding:16px 18px}
.num{flex:none;min-width:38px;height:38px;border-radius:50%;background:var(--beige);color:var(--maroon);font-family:var(--serif);font-weight:bold;font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.card.open .num{background:var(--maroon);color:#fff}
.who{flex:1;min-width:0}
.name{font-family:var(--serif);font-size:20px;line-height:1.35;color:var(--maroon);font-weight:bold}
.title{margin-top:3px;font-size:15px;line-height:1.5;color:#7B5F1F;background:var(--gold-bg);display:inline-block;padding:1px 10px;border-radius:6px}
.chev{flex:none;width:22px;height:22px;margin-top:8px;stroke:var(--gold);fill:none;stroke-width:2.5;transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.body{display:none;padding:0 18px 20px 70px}
.card.open .body{display:block}
.body .lbl{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;border-top:1px solid var(--line);padding-top:14px}
.body p{margin:0;font-size:17.5px;line-height:1.85;color:var(--ink)}
.crumb{font-size:13px;color:var(--ink-soft);margin-top:4px}
.crumb b{color:var(--maroon);font-weight:600}
mark{background:#F0DC9C;color:inherit;border-radius:3px;padding:0 1px}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);font-family:var(--serif);font-size:19px}
.result-info{margin-bottom:16px;color:var(--ink-soft);font-size:16px}

/* Back to top */
#top{position:fixed;right:18px;bottom:18px;width:48px;height:48px;border-radius:50%;border:0;background:var(--maroon);color:#fff;box-shadow:0 4px 14px rgba(63,7,20,.3);display:none;align-items:center;justify-content:center;z-index:30}
#top.show{display:flex}
#top svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.5}
footer{text-align:center;color:var(--ink-soft);font-size:14px;padding:0 20px 40px}

/* Responsive */
@media (max-width:820px){
  .sections{display:flex;overflow-x:auto;gap:10px;padding-bottom:6px;scroll-snap-type:x proximity;margin-right:-20px;padding-right:20px}
  .sec{flex:0 0 168px;scroll-snap-align:start}
}
@media (max-width:560px){
  body{font-size:16.5px}
  .bar-inner{padding:10px 14px 0}
  main{padding:18px 14px 90px}
  .tab{font-size:16px;padding:10px 4px}
  .head{padding:14px 14px;gap:11px}
  .name{font-size:18.5px}
  .body{padding:0 14px 18px 14px}
  .body p{font-size:17px}
  .num{min-width:34px;height:34px;font-size:14px}
}
@media print{.bar,#top,.tools button{display:none}.card .body{display:block!important}}
</style>
</head>

<script>
/* ============ DATA (verbatim from the Master Registers) ============ */
/* entry: [number, name, title-in-parentheses-or-empty, important facts] */
const DATA = [
{
 key:"top", label:"Top Sahabah", reg:"Master Register 1: Top Sahabah",
 sections:[
 {part:"Part 1", title:"Pre-Prophethood Household & Early Makkan Dawah", sub:"Book 1: Lessons 1–10", items:[
 [1,`Hamzah ibn Abdul Muttalib`,`Abu 'Umarah / Asadullah — "The Lion of Allah"`,`Paternal uncle and foster brother of the Prophet (via Thuwaybah); early convert in Makkah who shielded the Prophet; carried the first white banner at Ghazwat Al-Abwa' (Waddan); slew Shaybah ibn Rabi'ah in the opening Badr duel; martyred and mutilated at Uhud by Wahshi ibn Harb.`],
 [2,`Barakah al-Habashiyyah`,`Umm Ayman`,`Inherited Abyssinian bondwoman of the Prophet's father Abdullah who nurtured him following Aminah's death at Al-Abwa'; early believer whom the Prophet called "my mother after my mother"; married Zayd ibn Harithah and gave birth to Usamah ibn Zayd.`],
 [3,`Abu Hurairah`,`Abdur-Rahman ibn Sakhr ad-Dawsi`,`Arrived accepting Islam from the Daws tribe around the conquest of Khaybar in 7 AH; foremost resident of the Suffah who endured extreme hunger to remain beside the Prophet; the most prolific transmitter of Prophetic Hadith in Islamic history.`],
 [4,`Zainab bint Rasoolillah`,``,`Eldest daughter of the Prophet and Khadijah; married to Abul-'Aas ibn al-Rabi'; ransomed her captive husband at Badr using Khadijah's onyx necklace; migrated to Madinah and was later reunited with Abul-'Aas under their original marriage contract without a new Nikah.`],
 [5,`Ruqayyah bint Rasoolillah`,``,`Second daughter of the Prophet and Khadijah; married Uthman ibn Affan and migrated with him to Abyssinia; fell severely ill with fever in Madinah and passed away on the exact day Zayd ibn Harithah arrived with news of the victory at Badr.`],
 [6,`Uthman ibn Affan`,`Abu Amr / Dhun-Nurayn`,`Early convert through Abu Bakr; migrated to Abyssinia with Ruqayyah; excused from physical combat at Badr to nurse the dying Ruqayyah but received a veteran's full share and reward; married Umm Kulthum in 3 AH; equipped one-third of the Tabuk army with 300 camels and 1,000 gold dinars.`],
 [7,`Khadijah bint Khuwaylid`,`Umm al-Mu'mineen / Umm al-Qasim`,`First human being unconditionally to believe in the Prophet; mother of all the Prophet's children except Ibrahim; supported the Dawah with her entire wealth; endured the 3-year Shi'b Abi Talib boycott; passed away in the Year of Sorrow (10th year of Prophethood).`],
 [8,`Abu Bakr As-Siddiq`,`Abdullah ibn Abi Quhafah / At-Taqiyy`,`Foremost adult free male believer; brought 5 of the 10 Promised Paradise into Islam; sole companion of the Hijrah in Cave Thawr; appointed Ameer al-Hajj in 9 AH; led the congregational prayers during the Prophet's final illness; first Rightly Guided Caliph.`],
 [9,`Aishah bint Abi Bakr`,`Umm al-Mu'mineen / As-Siddiqah`,`Most knowledgeable woman of the Ummah; betrothed in Makkah and marriage consummated in Shawwal in Madinah; exonerated from the slander (Hadithat al-Ifk) by ten verses in Surah An-Nur; the Prophet chose her apartment for his final illness and passed away resting upon her chest.`],
 [10,`Umar ibn al-Khattab`,`Abu Hafs / Al-Farooq`,`Emigrated openly to Madinah; possessed divine concordance (Muwafaqat Umar) in numerous revelations; advocated execution of Badr captives; donated half his wealth for Tabuk; second Rightly Guided Caliph.`],
 [11,`Al-Zubayr ibn al-Awwam`,`Abu Abdillah / Hawariyy Rasoolillah — "The Disciple"`,`Son of the Prophet's aunt Safiyyah; one of the Ten Promised Paradise; one of only two horsemen at Badr where his body was covered in battle scars; intercepted Hatib's courier at Rawdat Khakh.`],
 [12,`Abdur-Rahman ibn Awf`,`Abu Muhammad`,`One of the Ten Promised Paradise; paired with Sa'd ibn al-Rabi' in the Brotherhood Pact and built his wealth in the Qaynuqa' market; pointed out Abu Jahl to the young sons of Afra' at Badr; led the Fajr prayer on the march to Tabuk where the Prophet prayed behind him.`],
 [13,`Sa'd ibn Abi Waqqas`,`Abu Ishaq`,`Maternal uncle of the Prophet and one of the Ten Promised Paradise; the first to shoot an arrow in the cause of Allah; protected the Prophet at Uhud where the Prophet said: "Shoot, O Sa'd! May my father and mother be sacrificed for you!".`],
 [14,`Talhah ibn Ubaydillah`,`Abu Muhammad / Talhat al-Khayr`,`One of the Ten Promised Paradise; ran to congratulate Ka'b ibn Malik upon his forgiveness; shielded the Prophet with his own body at Uhud, sustaining over thirty wounds and a paralyzed hand; extracted the helmet rings from the Prophet's face.`],
 [15,`Ali ibn Abi Talib`,`Abu al-Hasan / Abu Turab`,`First child to accept Islam (at age 10); slept in the Prophet's bed on the night of Hijrah; married Fatimah az-Zahra; killed Al-Walid ibn Utbah at Badr and Amr ibn Abd Wudd at Khandaq; standard-bearer at Khaybar; fourth Rightly Guided Caliph.`],
 [16,`Al-Abbas ibn Abdul Muttalib`,`Abu al-Fadl`,`Paternal uncle of the Prophet; addressed the Madinans at the Second Pledge of 'Aqabah; sent intelligence dispatches before Uhud; rallied the Muslims with his booming voice at Hunayn.`],
 [17,`Ja'far ibn Abi Talib`,`Abu Abdillah / Dhol-Janahayn — "The Two-Winged"`,`Elder brother of Ali raised by Al-Abbas; chief spokesman of the Second Abyssinian Migration who recited Surah Maryam to King Najashi; returned to Madinah on the day Khaybar fell; martyred at Mu'tah after both arms were severed.`],
 [18,`Zayd ibn Harithah`,`Abu Usamah / Hibbu Rasoolillah — "The Beloved"`,`First freed slave to accept Islam; accompanied the Prophet to Ta'if; the only Companion explicitly mentioned by name in the Qur'an (Surah Al-Ahzab 33:37); first appointed commander at Mu'tah where he was martyred.`],
 [19,`Al-Arqam ibn Abi al-Arqam`,``,`Early convert whose residence on Mount Safa (Dar al-Arqam) served as the secret teaching sanctuary and headquarters of the early Muslim community.`],
 [20,`Umm Salamah`,`Hind bint Abi Umayyah / Umm al-Mu'mineen`,`Migrated to both Abyssinia and Madinah with Abu Salamah; married the Prophet in 4 AH; advised the Prophet at Hudaybiyyah to shave his head and slaughter his sacrifice to break the deadlock; among the surviving wives.`],
 [21,`Abu Salamah`,`Abdullah ibn Abdil-Asad`,`Foster brother of the Prophet and Hamzah (via Thuwaybah); migrated to Abyssinia and Madinah; wounded at Uhud and passed away in Madinah in 4 AH.`],
 [22,`Asma' bint 'Umays`,``,`Wife of Ja'far ibn Abi Talib who migrated to Abyssinia; defended the rank of the Abyssinian migrants when Umar joked about precedence; later married Abu Bakr and gave birth to Muhammad ibn Abi Bakr at Dhul-Hulayfah during the Farewell Hajj.`]
 ]},
 {part:"Part 2", title:"The Boycott, Ta'if, Pledges of 'Aqabah & Hijrah", sub:"Books 2 & 3: Lessons 11–16", items:[
 [23,`Sawdah bint Zam'ah`,`Umm al-Mu'mineen`,`Early convert who migrated to Abyssinia with As-Sakran ibn Amr; married the Prophet in Ramadan of the 10th Year of Prophethood and was his sole cohabiting wife for over three years; granted her night turn to Aishah in her later years.`],
 [24,`Abdullah ibn Mas'ud`,`Abu Abdur-Rahman`,`Early convert who pastured sheep in Makkah; severed the head of Abu Jahl at Badr; renowned master of Quranic recitation who carried the Prophet's Siwak and sandals.`],
 [25,`Bilal ibn Rabah`,`Abu Abdillah / Mu'adhin ar-Rasool`,`Abyssinian slave tortured under the Makkan sun by Umayyah ibn Khalaf while repeating "Ahad, Ahad!"; purchased and freed by Abu Bakr; chosen as the first official caller of Adhan due to his carrying voice; identified and slew Umayyah at Badr.`],
 [26,`Abdullah ibn Salam`,`Abu Yusuf`,`Eminent Jewish rabbi and scriptural scholar of Banu Qaynuqa' who accepted Islam immediately upon recognizing the Prophetic signs when the Prophet arrived in Madinah.`],
 [27,`As'ad ibn Zurarah`,`Abu Umamah al-Ansari`,`Among the first six Khazraj youth to convert in the 11th year; took the First and Second Pledges of 'Aqabah; hosted Mus'ab ibn 'Umair in Madinah; guardian of Sahl and Suhayl.`],
 [28,`'Ubadah ibn al-Samit`,`Abu al-Walid`,`Participant in both Pledges of 'Aqabah; narrated the Hadith outlining the terms of the First Pledge; oversaw the logistical expulsion of Banu Qaynuqa'.`],
 [29,`Mus'ab ibn 'Umair`,`Abu Abdillah / Al-Muqri' — "The Reciter"`,`First ambassador of Islam sent to Madinah to teach the Qur'an; carried the white banner of the Prophet at Badr and Uhud, where he was martyred.`],
 [30,`Usayd ibn Hudayr`,`Abu Yahya`,`Chieftain of Banu Abd al-Ashhal who approached Mus'ab with a spear to expel him, but converted upon hearing Surah Az-Zukhruf; one of the 12 Nuqaba'.`],
 [31,`Sa'd ibn Mu'adh`,`Abu Amr`,`Paramount chief of Aws whose conversion brought his entire clan into Islam; delivered the speech of allegiance for the Ansar before Badr; wounded in the medial arm vein at Khandaq; arbitrated the fate of Banu Qurayzah; the Throne of Allah shook at his death.`],
 [32,`Al-Bara' ibn 'Aazib`,``,`Young Ansari Companion who memorized Surahs like Al-A'la before the Prophet arrived in Madinah; participated in numerous expeditions after reaching puberty.`],
 [33,`Nusaybah bint Ka'b`,`Umm 'Umarah`,`One of only two women who pledged allegiance at the Second Pledge of 'Aqabah; heroically defended the Prophet with sword and bow at Uhud, sustaining twelve wounds.`],
 [34,`Asma' bint Abi Bakr`,`Dhat al-Nitaqayn`,`Daughter of Abu Bakr who tore her waistband into two strips to tie provisions for Cave Thawr; mother of Abdullah ibn al-Zubayr (the first child born in Islam after Hijrah).`],
 [35,`Abu Ayyub al-Ansari`,`Khalid ibn Zayd`,`Hosted the Prophet in his home for seven months when Al-Qaswa' knelt at his residence; gave up his upper floor out of reverence.`]
 ]},
 {part:"Part 3", title:"The Madinan State, Badr & Uhud", sub:"Books 3, 4 & 5: Lessons 17–28", items:[
 [36,`Anas ibn Malik`,`Abu Hamzah / Khadim ar-Rasool`,`Served the Prophet for ten years in Madinah; hosted the Brotherhood Pact (Mu'akhah) between Muhajirun and Ansar in his house; transmitted the Hadith of the Prophet's longing for Madinah upon returning from Tabuk.`],
 [37,`Sa'd ibn al-Rabi'`,``,`Wealthy Ansari chieftain paired with Abdur-Rahman ibn Awf in the Brotherhood Pact who offered half his wealth and orchards; martyred at Uhud.`],
 [38,`Abdullah ibn Zayd ibn Abd Rabbihi`,``,`Ansari Companion who saw the complete Adhan in a true dream and was instructed to teach its words to Bilal.`],
 [39,`Abdullah ibn Jahsh`,``,`Commander of the Nakhlah reconnaissance patrol who carried the sealed letter; martyred and mutilated at Uhud.`],
 [40,`Umm Kulthum bint Rasoolillah`,``,`Daughter of the Prophet who married Uthman in 3 AH following Ruqayyah's death, cementing his title Dhun-Nurayn.`],
 [41,`Al-Miqdad ibn 'Amr`,`Ibn al-Aswad`,`Spokesman for the Muhajirun at Badr who declared: "We will not say to you as the people of Musa said..."; the sole cavalry horseman in the Muslim army at Badr.`],
 [42,`Al-Hubab ibn al-Mundhir`,`Dhur-Ra'y`,`Expert strategist at Badr who advised the Prophet to reposition the camp to the nearest water well to deprive the enemy.`],
 [43,`Fatimah az-Zahra bint Rasoolillah`,`Sayyidatu Nisa' al-Jannah`,`Youngest daughter of the Prophet; married Ali in 2 AH using the proceeds of his Hutamiyyah armor; mother of Al-Hasan and Al-Husayn.`],
 [44,`Al-Hasan ibn Ali`,`Sayyid Shabab Ahl al-Jannah`,`Eldest son of Ali and Fatimah; the Prophet foretold that through him Allah would reconcile between two massive factions of Muslims.`],

 [46,`Abdullah ibn Jubayr`,``,`Commander of the 50 archers on Mount 'Aynayn at Uhud who remained steadfast and was martyred when the polytheist cavalry outflanked the pass.`],
 [47,`Abu Dujanah`,`Simak ibn Kharashah`,`Took the Prophet's sword at Uhud with its full right, tied his red headband, and cut through the Makkan lines.`],

 [49,`Ka'b ibn Malik`,``,`Recognized the Prophet alive beneath his helmet at Uhud; one of the three who remained behind from Tabuk and underwent a 50-day boycott until forgiven.`],
 [50,`Abu Ubaydah ibn al-Jarrah`,`Ameer ibn Abdillah / Ameen al-Ummah`,`One of the Ten Promised Paradise; used his front teeth to pull out the embedded helmet rings from the Prophet's cheek at Uhud.`],

 ]},
 {part:"Part 4", title:"Tragedy, Trench & Expulsions", sub:"Books 5, 6 & 7: Lessons 29–34", items:[
 [52,`Zainab bint Jahsh`,`Umm al-Mu'mineen`,`Paternal cousin of the Prophet; married to Zayd ibn Harithah; divinely married to the Prophet in Surah Al-Ahzab to abolish adoption taboos; one of the surviving wives.`],
 [53,`Juwayriyah bint al-Harith`,`Umm al-Mu'mineen`,`Daughter of the chief of Banu Mustaliq; freed and married by the Prophet, prompting the Sahabah to emancipate 100 captive families.`],
 [54,`Hassan ibn Thabit`,`Sha'ir ar-Rasool`,`Renowned poet of the Prophet who defended Islam with his verses; received the Hadd penalty of 80 lashes following the slander incident.`],
 [55,`Salman al-Farsi`,`Abu Abdillah`,`Persian seeker of truth who advised digging the defensive trench (Khandaq) around Madinah; the Prophet said: "Salman is of us, the Ahl al-Bayt".`],
 [56,`Jabir ibn Abdillah`,`Abu Abdillah`,`Slaughtered a small ewe and prepared barley dough during Khandaq, which the Prophet miraculously multiplied to feed 1,000 workers.`],
 [57,`Hudhayfah ibn al-Yaman`,`Sahib Sirr ar-Rasool — "Keeper of the Secret"`,`Dispatched across the trench in the freezing dark to reconnoiter Abu Sufyan's camp; entrusted with the roster of hypocrites in Madinah.`]
 ]},
 {part:"Part 5", title:"Treaty, Expeditions & the Late Era", sub:"Books 8–14: Lessons 35–47", items:[

/* ============ APP ============ */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['’‘`ʿʾ]/g,'').replace(/\s+/g,' ');
const ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';

let state = {cat:0, sec:0};
try{ const s = JSON.parse(localStorage.getItem('sahabah-nav')||'null'); if(s && DATA[s.cat] && DATA[s.cat].sections[s.sec]) state = s; }catch(e){}
const openSet = new Set();

const total = DATA.reduce((a,c)=>a+c.sections.reduce((b,s)=>b+s.items.length,0),0);
$('#totals').textContent = DATA.map(c=>c.label+': '+c.sections.reduce((b,s)=>b+s.items.length,0)).join('  ·  ') + '  ·  Total: ' + total;

function save(){ try{ localStorage.setItem('sahabah-nav', JSON.stringify(state)); }catch(e){} }

function renderTabs(){
  const t = $('#tabs');
  t.innerHTML = DATA.map((c,i)=>{
    const n = c.sections.reduce((b,s)=>b+s.items.length,0);
    return `<button class="tab" role="tab" aria-selected="${i===state.cat}" data-cat="${i}">${esc(c.label)} <span class="n">${n}</span></button>`;
  }).join('');
}

function cardHTML(it, ci, si, idx, opts){
  const [num,name,title,facts] = it;
  const id = `c${ci}-${si}-${idx}`;
  const open = opts.forceOpen || openSet.has(id);
  const hl = opts.hl || (x=>esc(x));
  return `<article class="card${open?' open':''}" id="${id}">
    <button class="head" aria-expanded="${open}" aria-controls="${id}-b" data-id="${id}">
      <span class="num">${num}</span>
      <span class="who">
        <span class="name">${hl(name)}</span>
        ${title?`<div><span class="title">${hl(title)}</span></div>`:''}
        ${opts.crumb?`<div class="crumb"><b>${esc(DATA[ci].label)}</b> › ${esc(DATA[ci].sections[si].part)}: ${esc(DATA[ci].sections[si].title)}</div>`:''}
      </span>${ICON_CHEV}
    </button>
    <div class="body" id="${id}-b"><div class="lbl">Important facts</div><p>${hl(facts)}</p></div>
  </article>`;
}

function render(){
  renderTabs();
  const main = $('#main');
  const q = $('#q').value.trim();
  $('#clear').classList.toggle('show', !!q);
  $('#tabs').classList.toggle('dim', !!q);
  if(q) return renderSearch(q, main);

  const cat = DATA[state.cat];
  const sec = cat.sections[state.sec];
  let h = '<nav class="sections" role="tablist" aria-label="Sections">';
  cat.sections.forEach((s,i)=>{
    h += `<button class="sec" role="tab" aria-selected="${i===state.sec}" data-sec="${i}">
      <span class="pt">${esc(s.part)}</span><span class="tt">${esc(s.title)}</span><span class="ct">${s.items.length} companions</span></button>`;
  });
  h += '</nav>';
  h += `<div class="sec-head"><div class="kicker">${esc(cat.label)} · ${esc(sec.part)}</div>
        <h2>${esc(sec.title)}</h2><div class="sub">${esc(sec.sub)}</div></div>
        <div class="tools"><span class="count">${sec.items.length} companions in this section</span>
        <button id="toggleAll" type="button">Expand all</button></div>`;
  h += '<div class="list">' + sec.items.map((it,i)=>cardHTML(it,state.cat,state.sec,i,{})).join('') + '</div>';
  main.innerHTML = h;
  syncToggleLabel();
}

function renderSearch(q, main){
  const terms = norm(q).split(' ').filter(Boolean);
  const hits = [];
  DATA.forEach((c,ci)=>c.sections.forEach((s,si)=>s.items.forEach((it,i)=>{
    const hay = norm(it[1]+' '+it[2]+' '+it[3]);
    if(terms.every(t=>hay.includes(t))) hits.push([it,ci,si,i]);
  })));
  // highlighter: match terms ignoring apostrophes by building a char map
  const hl = text => {
    let map=[], clean='';
    for(let i=0;i<text.length;i++){ const ch=text[i];
      if(/['’‘`ʿʾ]/.test(ch)) continue;
      const n = ch.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      for(const c of n){ clean+=c; map.push(i); }
    }
    const marks = new Array(text.length).fill(false);
    terms.forEach(t=>{ let p=0; while((p=clean.indexOf(t,p))>-1){
      const a=map[p], b=map[p+t.length-1];
      for(let k=a;k<=b;k++) marks[k]=true; p+=t.length; } });
    let out='', on=false;
    for(let i=0;i<text.length;i++){
      if(marks[i]&&!on){out+='<mark>';on=true;} if(!marks[i]&&on){out+='</mark>';on=false;}
      out+=esc(text[i]);
    }
    return out+(on?'</mark>':'');
  };
  let h = `<div class="result-info"><b>${hits.length}</b> result${hits.length===1?'':'s'} for “${esc(q)}” across all ten sections</div>`;
  if(!hits.length) h += '<div class="empty">No companions match your search.<br><small>Try a shorter word or a different spelling.</small></div>';
  else h += '<div class="list">'+hits.map(([it,ci,si,i])=>cardHTML(it,ci,si,i,{crumb:true,hl,forceOpen:openSet.has(`c${ci}-${si}-${i}`)||undefined})).join('')+'</div>';
  main.innerHTML = h;
}

function syncToggleLabel(){
  const b = $('#toggleAll'); if(!b) return;
  const cards = [...document.querySelectorAll('.card')];
  b.textContent = cards.every(c=>c.classList.contains('open')) ? 'Collapse all' : 'Expand all';
}

/* events */
document.addEventListener('click', e=>{
  const tab = e.target.closest('.tab');
  if(tab){ state.cat = +tab.dataset.cat; state.sec = 0; save(); render(); scrollTo({top:0}); return; }
  const sec = e.target.closest('.sec');
  if(sec){ state.sec = +sec.dataset.sec; save(); render(); const m=$('#main'); window.scrollTo({top:m.offsetTop-$('.bar').offsetHeight+130,behavior:'smooth'}); return; }
  const head = e.target.closest('.head');
  if(head){ const card = head.parentElement; const open = card.classList.toggle('open');
    head.setAttribute('aria-expanded', open); open?openSet.add(head.dataset.id):openSet.delete(head.dataset.id); syncToggleLabel(); return; }
  if(e.target.id==='toggleAll'){
    const cards=[...document.querySelectorAll('.card')];
    const openAll = !cards.every(c=>c.classList.contains('open'));
    cards.forEach(c=>{ c.classList.toggle('open',openAll); c.querySelector('.head').setAttribute('aria-expanded',openAll);
      openAll?openSet.add(c.id):openSet.delete(c.id); });
    syncToggleLabel();
  }
});
$('#q').addEventListener('input', ()=>{ render(); });
$('#clear').addEventListener('click', ()=>{ $('#q').value=''; render(); $('#q').focus(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#q').value){ $('#q').value=''; render(); } });
const topBtn = $('#top');
addEventListener('scroll', ()=>topBtn.classList.toggle('show', scrollY>500), {passive:true});
topBtn.addEventListener('click', ()=>scrollTo({top:0,behavior:'smooth'}));

render();
</script>
